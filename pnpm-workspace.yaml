packages:
  - apps/*
  - packages/*

catalog:
  "@playwright/experimental-ct-vue": 1.62.1
  "@playwright/test": 1.62.1
  "@vue/compiler-core": 3.5.42
  "@vue/compiler-dom": 3.5.42
  "@vue/compiler-sfc": 3.5.42
  "@vue/compiler-ssr": 3.5.42
  "@vue/shared": 3.5.42
  "@types/node": 24.13.3
  chart.js: 4.5.1
  nuxt: 4.5.2
  playwright: 1.62.1
  playwright-core: 1.62.1
  sass-embedded: 1.103.1
  typescript: 6.0.3
  unplugin-dts: 1.0.3
  vite: 8.2.2
  vue: 3.5.42
  vue-component-meta: 3.3.11
  vue-tsc: 3.3.11

# Security settings (See: https://pnpm.io/supply-chain-security)
trustPolicy: "no-downgrade"
trustPolicyExclude:
  - "chokidar@4.0.3" # See https://github.com/paulmillr/chokidar/issues/1440
  - "semver@6.3.1" # See https://github.com/npm/node-semver/issues/838
  - "pino@9.14.0" # See https://github.com/pinojs/pino/issues/2392
minimumReleaseAge: 2880 # Wait two days after a new version release - This is in sync with the `dependabot.yml` `cooldown` config
allowBuilds:
  "@modelcontextprotocol/inspector": false # Script is only needed for the local development of `@modelcontextprotocol/inspector` itself
  "@parcel/watcher": true # Downloads binary
  "better-sqlite3": true # Downloads binary
  "esbuild": true # Downloads binary
  sharp: true # Downloads binary
  "simple-git-hooks": true # Setup and update git hooks

overrides:
  "@playwright/experimental-ct-vue": "catalog:"
  "@playwright/test": "catalog:"
  "@vue/compiler-core": "catalog:"
  "@vue/compiler-dom": "catalog:"
  "@vue/compiler-sfc": "catalog:"
  "@vue/compiler-ssr": "catalog:"
  "@vue/shared": "catalog:"
  nuxt: "catalog:"
  playwright: "catalog:"
  playwright-core: "catalog:"
  typescript: "catalog:"
  vite: "catalog:"
  vue: "catalog:"
  sass-embedded: "catalog:"
  "@microsoft/eslint-formatter-sarif@3.1.0>eslint": "10" # Has an explicit dependency on eslint 8
  # fix vulnerable dependency versions:
  "@hono/node-server@<1.19.15": ^1.19.15
  fast-uri@<3.1.5: ^3.1.5
  hono@<4.12.34: ^4.12.34
  ip-address@<=10.3.0: ^10.3.1
