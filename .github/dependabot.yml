# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    cooldown:
      default-days: 2 # Wait two days after a new version release - This is in sync with the `pnpm-workspace.yaml` `minimumReleaseAge` config
    schedule:
      interval: daily
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"

      typescript:
        patterns:
          - typescript

      minor:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

    ignore:
      # keep this in sync with .node-version file, if we e.g. use node 20, we do not want to update the types to latest 22
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # minor update breaks automatic API documentation. See https://github.com/SchwarzIT/onyx/issues/5851
      - dependency-name: "storybook"
        update-types: [version-update:semver-patch]
      - dependency-name: "@storybook/"
        update-types: [version-update:semver-patch]

  - package-ecosystem: github-actions
    directories:
      - "/"
      - ".github/templates/*"
    cooldown:
      default-days: 2 # Wait two days after a new version release - This is in sync with the `pnpm-workspace.yaml` `minimumReleaseAge` config
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
