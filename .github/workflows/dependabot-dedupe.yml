name: Deduplicate Dependabot PRs

on:
  push:
    branches:
      - "dependabot/npm_and_yarn/*"
    paths:
      - "**/package.json"
      - "pnpm-lock.json"
      - "pnpm-workspace.json"

permissions:
  contents: read

jobs:
  dedupe:
    name: Deduplicate dependencies
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      - name: "🛃 Harden the runner (Audit all outbound calls)"
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: "🛒 Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/templates/node-setup
        with:
          pnpm_install_command: "pnpm install --frozen-lockfile --ignore-scripts"

      - name: Deduplicate dependencies
        run: pnpm dedupe

      - name: Set up Git
        run: |
          git config user.name "Dedupe Bot[bot]"
          git config user.email "bot@example.com"

      - name: Commit and push changes
        run: |
          git add pnpm-lock.yaml
          git commit -m "🧹 Deduplicate dependencies [dependabot skip]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
