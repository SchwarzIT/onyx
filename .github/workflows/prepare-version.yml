name: Prepare Version
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  changeset-action:
    name: Run Changeset Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: ./.github/templates/harden-runner
        with:
          policy-list: >
            nodejs
            github

      - name: "🛒 Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.GH_PUSH_PROTECTED_KEY }}
          fetch-depth: 0

      - uses: ./.github/templates/node-setup

      - name: Create Pull Request
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          publish-script: "exit 1" # Fail on publish - Should always only create a PR
          create-github-releases: false
          pr-title: "chore: update onyx versions and changelogs for release"
          github-token: ${{ secrets.GITHUB_TOKEN }}
